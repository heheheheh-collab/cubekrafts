# One-click deploy of Foreman, on a free plan, with no card.
#
# In Render: New → Blueprint → pick this repository and the branch. It reads
# this file, builds foreman/ with its own Dockerfile, and asks for the one
# value it cannot know — DATABASE_URL, from a free database at neon.tech.
#
# The Anthropic key is deliberately NOT here. Paste it into the app itself
# under ⋯ → Model once it is up: it is checked live, stored in the database,
# and survives restarts. That also means it is never in this file, in the
# repository, or in a deploy log.
#
# Two truths about a free plan, planned for rather than discovered later:
#
#   - It sleeps after 15 quiet minutes, and a sleeping Foreman cannot work
#     overnight, which is most of the reason to host it. Point a free monitor
#     (uptimerobot.com) at /api/health every 5 minutes and it stays awake.
#   - There is no permanent disk. Everything that matters is in Postgres —
#     tasks, approvals, drafts, the audit log, your key — but files an agent
#     wrote into its workspace are gone on redeploy.
#
# If Render gives you a different URL because the name is taken, change
# FOREMAN_ORIGIN to match it exactly. A passkey is bound to the address it
# was registered on, and sign-in will refuse politely if they disagree.
#
# The same Dockerfile runs unchanged on Railway, Koyeb or Fly if this plan
# stops suiting you. Nothing here is Render-specific except this file.

services:
  - type: web
    name: cubekrafts-foreman
    runtime: docker
    # Both relative to the repository root. The app is a subdirectory, so the
    # build context has to be narrowed or the Dockerfile's COPY finds nothing.
    dockerfilePath: ./foreman/Dockerfile
    dockerContext: ./foreman
    plan: free
    healthCheckPath: /api/health
    envVars:
      # The only one you supply. Everything else is settled here or in the app.
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "8080"
      - key: FOREMAN_ORIGIN
        value: https://cubekrafts-foreman.onrender.com
      # Render terminates TLS and forwards the caller's address, so the per-IP
      # rate limit reads the header rather than the socket.
      - key: FOREMAN_TRUST_PROXY
        value: "true"
      - key: FOREMAN_HOME
        value: /data
      - key: TICK_MS
        value: "600000"
