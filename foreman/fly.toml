# Fly, not Vercel: this is one long-lived process with a scheduler in it, and
# a serverless function that is frozen between requests cannot tick at 3am.
#
# The address is free and comes with the app: https://cubekrafts-foreman.fly.dev,
# with a real certificate and nothing to register. That is a genuine domain for
# our purposes rather than a shared one — `fly.dev` is on the Public Suffix
# List, so this subdomain is its own registrable domain. Cookies cannot be read
# by another Fly app, and WebAuthn will accept it as a relying party ID.
#
# The one thing it cannot do is email. Sending as you requires SPF and DKIM
# records, and this zone is Fly's, not yours. Until there is a domain you
# control, the email transport records instead of sending and says so.
#
#   fly launch --no-deploy --copy-config
#   fly volumes create foreman_data --size 3 --region lhr
#   fly secrets set ANTHROPIC_API_KEY=sk-ant-...
#   fly deploy
#
# And a Postgres, from either direction — Foreman does not care which:
#
#   fly postgres create --name cubekrafts-foreman-db --region lhr
#   fly postgres attach cubekrafts-foreman-db     # sets DATABASE_URL for you
#
# Fly's database product has changed name and shape more than once, so if
# that command is missing or looks unfamiliar, do not fight it. Create a free
# database at neon.tech or supabase.com and set the URL yourself:
#
#   fly secrets set DATABASE_URL='postgres://...'
#
# If you use Supabase, make it a NEW project. Foreman's twenty-odd tables
# have no business sharing a database with the live dealer app.
#
# FOREMAN_ORIGIN below already matches the free address. Change both together
# if you point a domain of your own at it — a passkey is bound to the origin
# it was registered on, so changing it means registering the passkey again.
#
# See PLAN.md §3.

app = "cubekrafts-foreman"
primary_region = "lhr"

[build]

[env]
  PORT = "8080"
  FOREMAN_HOST = "0.0.0.0"
  FOREMAN_HOME = "/data"
  # Not a secret, so it lives here rather than in `fly secrets` — and having
  # it in the file means the origin the app checks and the origin it is served
  # from cannot drift apart in a way nobody notices until sign-in breaks.
  FOREMAN_ORIGIN = "https://cubekrafts-foreman.fly.dev"
  # Fly terminates TLS and forwards the caller's address, so the per-IP rate
  # limit reads the header rather than the socket. Only ever true behind a
  # proxy that overwrites it — otherwise anyone can claim any address.
  FOREMAN_TRUST_PROXY = "true"
  # How often the scheduler looks for work. Ten minutes is enough for a
  # company this size and keeps the idle cost near zero.
  TICK_MS = "600000"

# The workspace and the artifact files. Postgres holds the graph; this holds
# the things you actually read.
[mounts]
  source = "foreman_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Never scale to zero. The whole point is that it is working while you are
  # asleep, and a machine that stopped cannot tick.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # One machine, deliberately. Two would both tick, and while the claim is
  # atomic — FOR UPDATE SKIP LOCKED — two schedulers doubles the model spend
  # for no extra throughput at this size.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  # Migrations run at boot inside the app, per-file and transactional, so
  # there is no separate release command to get out of step with the code.
  strategy = "immediate"
